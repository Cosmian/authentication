packages:
    - .

allowBuilds:
    "@swc/core": false
    esbuild: false

# Keep identical to `pnpm.overrides` in package.json. Newer pnpm (12 ignores package.json) reads only this
# file, pnpm 9 (CI and the Nix build) reads only package.json. A lockfile written without the matching
# `overrides:` block fails `pnpm install --frozen-lockfile` with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
    ws: ">=8.21.0"
    esbuild: ">=0.28.1"
    js-yaml: ">=4.3.0"
    postcss: ">=8.5.18"
