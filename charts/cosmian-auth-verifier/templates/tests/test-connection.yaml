apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cosmian-auth-verifier.fullname" . }}-test-connection
  labels:
    {{- include "cosmian-auth-verifier.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - --retry
        - '5'
        - --retry-all-errors
        {{- if .Values.authVerifier.tls.enabled }}
        # The pod does not hold the server CA; this only checks reachability.
        - --insecure
        {{- end }}
        - {{ printf "%s://%s:%v%s" (include "cosmian-auth-verifier.scheme" .) (include "cosmian-auth-verifier.fullname" .) .Values.service.port .Values.probes.path }}
  restartPolicy: Never
