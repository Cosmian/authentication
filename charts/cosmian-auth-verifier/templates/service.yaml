apiVersion: v1
kind: Service
metadata:
  name: {{ include "cosmian-auth-verifier.fullname" . }}
  labels:
    {{- include "cosmian-auth-verifier.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ include "cosmian-auth-verifier.scheme" . }}
      protocol: TCP
      name: {{ include "cosmian-auth-verifier.scheme" . }}
  selector:
    {{- include "cosmian-auth-verifier.selectorLabels" . | nindent 4 }}
