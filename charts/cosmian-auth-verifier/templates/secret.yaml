{{- $db := .Values.authVerifier.database -}}
{{- $ss := .Values.authVerifier.sessionStore -}}
{{- $dbUrl := and (ne $db.backend "sqlite") (not $db.existingSecret) $db.url -}}
{{- $ssUrl := and $ss.enabled (not $ss.existingSecret) $ss.url -}}
{{- if or $dbUrl $ssUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cosmian-auth-verifier.dbSecretName" . }}
  labels:
    {{- include "cosmian-auth-verifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $dbUrl }}
  database-url: {{ $dbUrl | quote }}
  {{- end }}
  {{- if $ssUrl }}
  session-store-url: {{ $ssUrl | quote }}
  {{- end }}
{{- end }}
