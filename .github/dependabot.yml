---
version: 2
updates:
  - package-ecosystem: npm
    directory: /admin-ui
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - admin-ui
    groups:
      admin-ui-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      admin-ui-security:
        applies-to: security-updates
        patterns: ["*"]
