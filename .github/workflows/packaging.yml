---
name: Packaging

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      toolchain:
        description: Rust toolchain to use (e.g., stable, 1.86.0)
        required: true
        type: string
        default: stable

jobs:
  docker:
    uses: ./.github/workflows/packaging-docker.yml
    with:
      toolchain: ${{ inputs.toolchain }}
    permissions:
      contents: read
      packages: write
      id-token: write
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

  packages:
    name: ${{ matrix.runner }}-${{ matrix.link }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        link: [static, dynamic]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 15
            stalled-download-timeout = 15
            narinfo-cache-negative-ttl = 0

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Warm Nix store
        run: |
          sed -n 's/.*url *= *"\(https:\/\/[^"]*\.tar\.gz\)".*/\1/p' default.nix | sort -u | while read -r url; do
            dest="/tmp/$(basename "$url")"
            fallback=$(echo "$url" | sed 's|https://package.cosmian.com/nixpkgs/|https://github.com/NixOS/nixpkgs/archive/|')
            echo "Downloading $(basename "$url") …"
            if ! curl --retry 3 --retry-delay 5 --retry-all-errors -fsSL -o "$dest" "$url"; then
              echo "Mirror failed, falling back to GitHub …"
              curl --retry 5 --retry-delay 10 --retry-max-time 300 --retry-all-errors -fsSL -o "$dest" "$fallback"
            fi
            nix-prefetch-url --unpack --name source "file://$dest"
            rm -f "$dest"
          done

      - name: Set up GPG
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: List GPG keys
        run: gpg -K

      - name: Install cargo-packager (macOS DMG builds)
        if: runner.os == 'macOS'
        run: cargo install --locked cargo-packager

      - name: Package with GPG signature
        run: |
          bash .github/scripts/nix.sh --link ${{ matrix.link }} package
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}
          NIX_CURL_FLAGS: --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.link }}_${{ matrix.runner }}-release
          path: result-*-${{ matrix.link }}/*
          retention-days: 1
          if-no-files-found: error

  publish-release:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

    name: Publish ${{ matrix.runner }}-${{ matrix.link }}
    needs: packages
    concurrency:
      group: publish-release
      cancel-in-progress: false
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        link: [static, dynamic]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        package-type: [deb, rpm, dmg]
        cpu-arch: [amd64, arm64]
        exclude:
          - runner: ubuntu-24.04
            package-type: dmg
          - runner: ubuntu-24.04-arm
            package-type: dmg
          - runner: macos-15
            package-type: deb
          - runner: macos-15
            package-type: rpm
          - runner: ubuntu-24.04
            cpu-arch: arm64
          - runner: ubuntu-24.04-arm
            cpu-arch: amd64
          - runner: macos-15
            cpu-arch: amd64

    steps:
      - name: Clean up pre-existing artifact files
        run: rm -rf result-*

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.link }}_${{ matrix.runner }}-release

      - name: Display structure
        run: find . -type f | head -40

      - name: Push packages
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          DESTINATION_DIR="/mnt/package/authentication/${BRANCH}"
          RESULT_DIR="result-${{ matrix.package-type }}-${{ matrix.link }}"

          # cargo-packager outputs aarch64 for Apple Silicon;
          # rpm uses x86_64/aarch64; deb uses the matrix cpu-arch
          if [[ "${{ matrix.runner }}" == macos* ]]; then
            PACKAGE_PATTERN="aarch64"
          elif [[ "${{ matrix.package-type }}" == "rpm" ]]; then
            if [[ "${{ matrix.runner }}" == "ubuntu-24.04-arm" ]]; then
              PACKAGE_PATTERN="aarch64"
            else
              PACKAGE_PATTERN="x86_64"
            fi
          else
            PACKAGE_PATTERN="${{ matrix.cpu-arch }}"
          fi

          PKG_EXT=".${{ matrix.package-type }}"
          remote_dir="${DESTINATION_DIR}/${{ matrix.package-type }}/${{ matrix.cpu-arch }}/${{ matrix.link }}"
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            cosmian@package.cosmian.com mkdir -p "$remote_dir"
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            $RESULT_DIR/*${PACKAGE_PATTERN}*${PKG_EXT}* \
            cosmian@package.cosmian.com:"${remote_dir}/"

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') && matrix.link == 'static'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            result-${{ matrix.package-type }}-${{ matrix.link }}/*

  cargo-publish:
    uses: ./.github/workflows/cargo-publish.yml
    with:
      toolchain: ${{ inputs.toolchain }}
    secrets:
      token: ${{ secrets.CRATES_IO }}

  tests:
    needs: packages
    uses: ./.github/workflows/packaging-tests.yml
    with:
      toolchain: 1.90.0
