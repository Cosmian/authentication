---
name: Docs

on:
  pull_request:
    paths:
      - "server/documentation/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-docs:
    name: Combined docs check
    # Secrets are unavailable to fork and dependabot PRs
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public_documentation
        uses: actions/checkout@v6
        with:
          repository: Cosmian/public_documentation
          ref: develop
          submodules: true
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Checkout authentication
        uses: actions/checkout@v6
        with:
          path: authentication

      - name: Install mdBook toolchain
        run: sh theme/scripts/setup-mdbook.sh

      - name: Build combined documentation
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          bash .github/scripts/build-staging.sh authentication
