---
name: CI checks

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string

jobs:
  cla-assistant:
    if: |
      (github.event.pull_request.head.repo.full_name != github.repository)
      && ((github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target')
    uses: ./.github/workflows/cla.yml
    secrets: inherit

  cargo-deny:
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo-deny check
        run: cargo deny --log-level warn --all-features check

  cargo-machete:
    uses: Cosmian/reusable_workflows/.github/workflows/cargo-machete.yml@develop
    with:
      toolchain: ${{ inputs.toolchain }}

  cargo-clippy:
    name: Cargo test - ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run unit tests
        run: cargo fmt --all -- --check --color always

      - name: Static analysis
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Static analysis all features
        run: cargo clippy --workspace --all-targets --no-default-features --features database,rustls -- -D warnings

      - name: Static analysis openssl backend
        run: cargo clippy --workspace --all-targets --no-default-features --features database,openssl -- -D warnings

  cargo-test:
    name: Cargo test - ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run unit tests
        run: |
          cargo test --workspace --lib -- --nocapture

  cargo-saml:
    name: Cargo SAML (Nix) - ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Bundled xmlsec (nix/xmlsec-static.nix) is built per platform, matching the packaging matrix.
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    env:
      # Same pin as shell.nix/common.sh; nix-shell takes its bash from <nixpkgs>, and without it falls back to macOS /bin/bash 3.2.
      PIN_URL: https://package.cosmian.com/nixpkgs/8b27c1239e5c421a2bbc2c65d52e4a6fbf2ff296.tar.gz

    steps:
      - name: Nix installation
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 15
            stalled-download-timeout = 15
            narinfo-cache-negative-ttl = 0

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Static analysis (saml feature)
        run: nix-shell -I "nixpkgs=$PIN_URL" --run "cargo clippy --workspace --all-targets --features auth_verifier/saml -- -D warnings"

      - name: Run unit tests (saml feature)
        run: nix-shell -I "nixpkgs=$PIN_URL" --run "cargo test --workspace --lib --features auth_verifier/saml -- --nocapture"
