---
name: Packaging

on:
  push:
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
  workflow_dispatch:

jobs:
  packaging:
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/packaging.yml
    secrets: inherit
    with:
      toolchain: stable
