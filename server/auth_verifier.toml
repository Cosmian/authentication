# =============================================================================
# Auth Authentication Server — Sample Configuration File
# =============================================================================
#
# Copy this file to auth_verifier.toml (or any path of your choosing) and
# adjust every value marked with <REQUIRED> before starting the server.
#
# Start the server with:
#   auth_verifier                         # reads ./auth_verifier.toml by default
#   auth_verifier /path/to/config.toml    # explicit path
#
# All paths are resolved relative to the working directory unless they are
# absolute paths.
# =============================================================================


# -----------------------------------------------------------------------------
# Network binding
# -----------------------------------------------------------------------------

# The hostname or IP address the server binds to.
# Use "0.0.0.0" to listen on all interfaces.
host_name = "localhost" # <REQUIRED>

# The TCP port the server listens on.
# When [tls_params] is configured the server binds HTTPS; otherwise plain HTTP.
host_port = 8080 # <REQUIRED>

# Optional: if set, every unauthenticated request is treated as though it came
# from this username.  Useful for local development only — never set in
# production.
# default_username = "dev_user"


# Optional: path to the pre-built admin UI dist/ directory.
# When set and the server is built with the `admin-ui` feature, static files
# are served at /admin-ui with a SPA fallback for client-side routing.
admin_ui_path = "/usr/share/auth_verifier/admin-ui"


# -----------------------------------------------------------------------------
# RBAC roles
# -----------------------------------------------------------------------------
# Available role names exposed via GET /public/roles.
# The admin UI role-selection dropdowns are populated from this list.
# This must match the roles expected by your OPA policy.
roles = ["SuperAdmin", "DomainAdmin", "CryptoOfficer", "Auditor", "User"]


# -----------------------------------------------------------------------------
# TLS configuration  (optional — omit to run plain HTTP)
# -----------------------------------------------------------------------------
# When this section is present the server binds HTTPS and uses the key pair
# both for TLS and for JWT session signing (unless [session_jwt_params] is set).
# When absent the server binds plain HTTP and uses an ephemeral HS256 key for
# JWT signing (sessions are lost on restart — configure [session_jwt_params]
# for persistent signing keys without TLS).

# [tls_params]

# Path to the server private key in PKCS#8 PEM format.
# server_private_key = "certificates/server.key.pem" # <REQUIRED when TLS enabled>

# Path to the server certificate (or certificate chain) in PEM format.
# server_certificate = "certificates/server.cert.pem" # <REQUIRED when TLS enabled>

# Path to the CA certificate chain used to verify the server certificate.
# server_ca_chain = "certificates/ca.pem" # <REQUIRED when TLS enabled>

# Optional: path to a separate CA chain for verifying *client* certificates.
# When omitted, server_ca_chain is used for mTLS client verification as well.
# client_ca_cert_chain = "certificates/client-ca.chain.pem"

# Optional: colon-separated list of TLS cipher suites.
# When omitted, the default cipher suite list of the chosen TLS backend is used.
# tls_cipher_suites = "TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256"


# -----------------------------------------------------------------------------
# Session JWT keys (optional)
# -----------------------------------------------------------------------------
# Controls how session JWTs are signed. Resolution order:
#   1. This section ([session_jwt_params]) — explicit EC key files.
#   2. TLS key pair ([tls_params]) — reused for JWT signing when no explicit
#      JWT keys are configured.
#   3. Ephemeral HS256 key — generated at startup when neither TLS nor JWT keys
#      are configured. Sessions are lost on every restart. Use this only for
#      local development or short-lived demo deployments.
#
# Recommended for plain-HTTP deployments: configure this section with a
# dedicated EC P-256 key pair so sessions survive restarts.

# [session_jwt_params]
# # Path to the EC private key PEM file used to sign session JWTs.
# jwt_ec_private_key = "certificates/jwt.key.pem"
# # Path to the EC public key PEM file used to verify session JWTs.
# jwt_ec_public_key  = "certificates/jwt.pub.pem"


# -----------------------------------------------------------------------------
# Primary database (users, realms, credentials, …)
# -----------------------------------------------------------------------------
# When omitted, an SQLite file named auth_verifier.db is created in the
# working directory.

[database_params]

# Backend: "sqlite" | "postgresql" | "mysql"
backend = "sqlite"

# Connection URL formats:
#   SQLite:     sqlite://relative/path.db   or   sqlite:///absolute/path.db
#               sqlite::memory:  (in-memory, data lost on restart)
#   PostgreSQL: postgresql://user:password@host:5432/dbname
#   MySQL:      mysql://user:password@host:3306/dbname
# Absolute path under the package data directory (writable by the systemd
# service, which runs with ProtectSystem=strict and WorkingDirectory there).
connection_url = "sqlite:///var/lib/cosmian-auth/auth_verifier.db"

# Maximum number of pooled connections (default: 10).
# max_connections = 10

# Minimum number of idle connections kept open (default: 0).
# min_connections = 0

# Time in seconds before a connection attempt is aborted (default: 30).
# connect_timeout_secs = 30

# Time in seconds before an idle connection is closed (default: 600).
# idle_timeout_secs = 600

# When true (default), the database schema is created / migrated automatically
# on startup.  Set to false only when you manage migrations externally.
# auto_init_schema = true


# -----------------------------------------------------------------------------
# Session store (optional — defaults to the primary database)
# -----------------------------------------------------------------------------
# The session store holds active session tokens.  It can share the primary
# database or use a dedicated store (Redis recommended for high-throughput
# deployments).

# [sessions_store_params]
# backend = "redis"
# connection_url = "redis://localhost:6379"
# max_connections = 20


# -----------------------------------------------------------------------------
# Stale session collector (optional)
# -----------------------------------------------------------------------------
# A background task that periodically removes expired sessions from the
# session store.  Only relevant for SQL-backed session stores; Redis purges
# sessions automatically via TTL.

# [stale_session_collector_config]
# # How often the cleanup task runs, in seconds (default: 60).
# cleanup_interval_seconds = 300


# -----------------------------------------------------------------------------
# Forward proxy (optional)
# -----------------------------------------------------------------------------
# Used when the server needs to reach external services (e.g. fetching JWKS
# from a remote Identity Provider) through an HTTP proxy.

# [proxy_params]
# # The proxy URL, including scheme, host, and port.
# url = "http://proxy.example.com:3128"
# # Optional Basic-Auth credentials for the proxy.
# basic_auth_username = "proxy_user"
# # WARNING: storing passwords in plain text is a security risk.
# # Consider using a secrets manager or environment variable substitution.
# basic_auth_password = "proxy_secret"
# # Optional: override the Proxy-Authorization header with a custom value.
# # custom_auth_header = "Bearer <token>"
# # Hosts that bypass the proxy (comma-separated).
# exclusion_list = ["localhost", "127.0.0.1", "10.0.0.0/8"]
