# =============================================================================
# Authentication Verifier — Local Development Configuration (plain HTTP, no TLS)
# =============================================================================
#
# Start the server from the authentication/ directory:
#
#   cargo run -p auth_verifier -- server/auth_verifier.dev.toml
#
# On first start the DB is initialized automatically with:
#   - Admin realm ("_") with username/password authentication enabled
#   - Super-admin account: username "admin", password "change_me"
#
# Login at: http://localhost:8080/admin-ui
# =============================================================================

host_name = "127.0.0.1"
host_port = 8080

# ---------------------------------------------------------------------------
# Admin UI — serves the pre-built admin UI at /admin-ui.
# Build the UI first: cd admin-ui && pnpm build
# ---------------------------------------------------------------------------
admin_ui_path = "admin-ui/dist"

# ---------------------------------------------------------------------------
# Console logging
# ---------------------------------------------------------------------------
[log]
level = "debug"

# ---------------------------------------------------------------------------
# JWT signing keys — required when tls_params is absent.
# Uses the test EC P-256 keys bundled with the source tree.
# ---------------------------------------------------------------------------
[session_jwt_params]
jwt_ec_private_key = "server/src/tests/certificates/ec/auth.server.key.pem"
jwt_ec_public_key  = "server/src/tests/certificates/ec/auth.server.cert.pem"

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
[database_params]
backend        = "sqlite"
connection_url = "sqlite:///tmp/path.db"
auto_init_schema = true

# ---------------------------------------------------------------------------
# Dev seed
# ---------------------------------------------------------------------------
[dev_seed]
realm_id       = "dev-realm"
admin_username = "realm-admin"
admin_password = "change_me"

totp_username = "totp-user"
totp_password = "change_me"
totp_secret   = "GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"
