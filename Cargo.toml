[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Bruno Grieder <bruno.grieder@cosmian.com>"]
license = "BUSL-1.1"
license-file = "LICENSE"
repository = "https://github.com/Cosmian/authentication"
description = "Cosmian Authentication Server"

[workspace]
members = ["client", "server"]
resolver = "2"

[workspace.dependencies]
actix-cors = "0.7.1"
actix-service = "2.0"
actix-tls = "3.4"
actix-web = { version = "4.11", default-features = false, features = [
    "macros",
    "openssl",
] }
alcoholic_jwt = "4091"
argon2 = "0.4.1"
assert_matches = "1.5.0"
async-trait = "0.1"
backon = "1.6.0"
base32 = "0.5"
base64 = "0.22"
bb8-redis = "0.24.0"
bitflags = "2.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", default-features = false }
cmpv2 = { version = "0.2" }
cms = { version = "0.2.1" }
color-eyre = "0.6.2"
cookie_store = "0.22.1"
# TODO: fix the "rev" to ensure reproducible build of docker images, for both "cosmian_crypto_core" and "cosmian_logger"
cosmian_logger = { git = "https://github.com/Cosmian/http_client_server.git", branch = "develop", package = "cosmian_logger" }
der = "0.7.6"
derive_builder = "0.20.2"
derive_more = "2.0"
directories = "6.0"
enum_dispatch = "0.3.13"
eyre = "0.6.12"
flate2 = "1"
futures = "0.3.31"
hei-lib = { path = "crate/hei/hei-lib" }
hei-cli = { path = "crate/hei/hei-cli" }
hex = { version = "0.4.3", features = ["serde"] }
humantime = "2.1.0"
humantime-serde = "1.1.1"
iso8601 = { version = "0.6", features = ["serde"] }
itertools = "0.14.0"
jsonwebtoken = "10.3.0"
num_cpus = "1.17.0"
openssl = { version = "0.10" }
p256 = "0.13"
rand = "0.9.1"
redis = { version = "0.32.6", features = ["aio", "tokio-comp", "bb8"] }
reqwest = { version = "0.13.2" }
rsa = "0.9"
rustls = "0.23.35"
seq-macro = "0.3.6"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0"
serial_test = "3.2.0"
sha1 = "0.10"
sha2 = "0.10.9"
spki = "0.7"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
], default-features = false }
strum = { version = "0.26.3", features = ["derive"] }
tar = "0.4"
thiserror = "2.0.11"
# It is important to keep this version in sync with that of actix-web
# use `cargo tree -i tokio` to check there is no other version of tokio
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7.18"
totp-rs = "5.7.1"
toml = "0.9.8"
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
x509-cert = { version = "0.2" }
x509-tsp = "0.1"
zeroize = "1.8"
