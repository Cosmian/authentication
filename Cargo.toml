[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Bruno Grieder <bruno.grieder@cosmian.com>"]
license = "BUSL-1.1"
license-file = "LICENSE"
repository = "https://github.com/Cosmian/authentication"
description = "Cosmian Authentication Server"

[workspace]
members = ["client", "server"]
resolver = "2"

[workspace.dependencies]
actix-cors = "0.7.1"
actix-files = "0.6"
governor = "0.10"
actix-tls = "3.4"
actix-web = { version = "4.11", default-features = false, features = [
    "macros",
    "openssl",
] }
argon2 = "0.4.1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie_store = "0.22.1"
cosmian_logger = "0.8.1"
futures = "0.3.31"
hex = { version = "0.4.3", features = ["serde"] }
jsonwebtoken = "10.3.0"
openssl = { version = "0.10" }
pem = "3.0.6"
redis = { version = "0.32.6", features = ["aio", "tokio-comp", "bb8"] }
rand = { version = "0.9" }
reqwest = { version = "0.13.2" }
rustls = "0.23.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio",
    "postgres",
], default-features = false }
thiserror = "2.0.11"
# It is important to keep this version in sync with that of actix-web
# use `cargo tree -i tokio` to check there is no other version of tokio
tokio = { version = "1.48.0", features = ["full"] }
totp-rs = "5.7.1"
toml = "0.9.8"
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-cert = { version = "0.2", features = ["pem"] }
